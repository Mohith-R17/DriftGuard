        <circle cx="256" cy="160" r="24" fill="#ffffff" />
        <circle cx="320" cy="352" r="24" fill="#ffffff" />
        <circle cx="160" cy="256" r="24" fill="#ffffff" />
    </g>
    <!-- DriftGuard Text -->
    <text x="256" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-weight="700" font-size="120" fill="currentColor">
        Drift<tspan fill="#3b82f6">Guard</tspan>
