<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 256" fill="none">
    <title>DriftGuard Logo</title>
    <defs>
        <linearGradient id="shieldGradMain" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#3b82f6" />
            <stop offset="100%" stop-color="#1d4ed8" />
        </linearGradient>
        <linearGradient id="pulseGradMain" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#60a5fa" />
            <stop offset="100%" stop-color="#ffffff" />
        </linearGradient>
    </defs>
    <g transform="translate(16, 16) scale(0.4375)">
        <path d="M256 32 L64 96 V224 C64 352 144 448 256 480 C368 448 448 352 448 224 V96 Z" 
